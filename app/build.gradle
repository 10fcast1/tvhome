plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tvhome"
        minSdk 22          // Fire OS 7 = Android 9 (API 28); 22 keeps older Fire TVs working too
        targetSdk 28       // matches Fire OS 7 and avoids newer background/storage restrictions
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies on purpose: plain Android framework only.
